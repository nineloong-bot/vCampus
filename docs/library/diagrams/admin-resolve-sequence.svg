<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1110" role="img" aria-labelledby="title desc">
  <title id="title">管理员处理账号借阅顺序图</title>
  <desc id="desc">展示管理员按账号查询一条有效借阅，并在确认后原子地归还或标记遗失，最后刷新账号借阅状态的顺序。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .diagram-title { font-size: 25px; font-weight: 700; }
      .participant { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; rx: 7; }
      .participant-service { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.6; rx: 7; }
      .participant-data { fill: #ecfdf5; stroke: #059669; stroke-width: 1.6; rx: 7; }
      .pname { font-size: 13px; font-weight: 700; text-anchor: middle; }
      .lifeline { stroke: #94a3b8; stroke-width: 1.3; stroke-dasharray: 6 6; }
      .call { stroke: #334155; stroke-width: 1.6; marker-end: url(#arrow); }
      .return { stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .msg { font-size: 12px; text-anchor: middle; }
      .frame { fill: #ffffff; fill-opacity: .82; stroke: #64748b; stroke-width: 1.4; rx: 7; }
      .frame-title { fill: #e2e8f0; stroke: #64748b; stroke-width: 1.2; }
      .frame-label { font-size: 12px; font-weight: 700; }
      .divider { stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 6 5; }
      .note { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.3; rx: 7; }
      .note-text { font-size: 12px; }
      .activation { fill: #dbeafe; stroke: #2563eb; stroke-width: 1; }
    </style>
  </defs>

  <text x="800" y="35" class="diagram-title" text-anchor="middle">管理员处理某个账号的借阅 · 顺序图</text>

  <rect x="35" y="65" width="120" height="58" class="participant"/>
  <text x="95" y="99" class="pname">管理员</text>
  <rect x="215" y="65" width="150" height="58" class="participant"/>
  <text x="290" y="90" class="pname">LoanAdminPanel</text><text x="290" y="108" class="pname">UI</text>
  <rect x="425" y="65" width="160" height="58" class="participant"/>
  <text x="505" y="90" class="pname">LibraryClientService</text><text x="505" y="108" class="pname">Socket</text>
  <rect x="645" y="65" width="160" height="58" class="participant"/>
  <text x="725" y="90" class="pname">LibraryHandlers</text><text x="725" y="108" class="pname">Authorization</text>
  <rect x="865" y="65" width="160" height="58" class="participant-service"/>
  <text x="945" y="90" class="pname">RequestDeduplicator</text><text x="945" y="108" class="pname">requestId</text>
  <rect x="1085" y="65" width="160" height="58" class="participant-service"/>
  <text x="1165" y="90" class="pname">LibraryServiceImpl</text><text x="1165" y="108" class="pname">Service</text>
  <rect x="1305" y="65" width="130" height="58" class="participant-service"/>
  <text x="1370" y="90" class="pname">Locks + Tx</text><text x="1370" y="108" class="pname">Consistency</text>
  <rect x="1490" y="65" width="80" height="58" class="participant-data"/>
  <text x="1530" y="90" class="pname">Repos</text><text x="1530" y="108" class="pname">Access</text>

  <line x1="95" y1="123" x2="95" y2="1065" class="lifeline"/>
  <line x1="290" y1="123" x2="290" y2="1065" class="lifeline"/>
  <line x1="505" y1="123" x2="505" y2="1065" class="lifeline"/>
  <line x1="725" y1="123" x2="725" y2="1065" class="lifeline"/>
  <line x1="945" y1="123" x2="945" y2="1065" class="lifeline"/>
  <line x1="1165" y1="123" x2="1165" y2="1065" class="lifeline"/>
  <line x1="1370" y1="123" x2="1370" y2="1065" class="lifeline"/>
  <line x1="1530" y1="123" x2="1530" y2="1065" class="lifeline"/>

  <line x1="95" y1="165" x2="290" y2="165" class="call"/><text x="192" y="156" class="msg">输入账号并查询</text>
  <line x1="290" y1="205" x2="505" y2="205" class="call"/><text x="397" y="196" class="msg">searchAllLoans(account)</text>
  <line x1="505" y1="245" x2="725" y2="245" class="call"/><text x="615" y="236" class="msg">LIBRARY_SEARCH_ALL_LOANS</text>
  <rect x="635" y="260" width="180" height="52" class="note"/>
  <text x="725" y="282" class="note-text" text-anchor="middle">requirePermission</text>
  <text x="725" y="302" class="note-text" text-anchor="middle">LIBRARY_ADMIN</text>
  <line x1="725" y1="335" x2="505" y2="335" class="return"/><text x="615" y="326" class="msg">账号当前借阅与历史</text>
  <line x1="505" y1="370" x2="290" y2="370" class="return"/><text x="397" y="361" class="msg">完整 LoanView 列表</text>
  <line x1="290" y1="415" x2="95" y2="415" class="return"/><text x="192" y="406" class="msg">显示账号、书名、副本条码</text>
  <line x1="95" y1="455" x2="290" y2="455" class="call"/><text x="192" y="446" class="msg">确认归还或标记遗失</text>

  <line x1="290" y1="500" x2="505" y2="500" class="call"/><text x="397" y="491" class="msg">resolveLoan(loanId, resolution, version)</text>
  <line x1="505" y1="545" x2="725" y2="545" class="call"/><text x="615" y="536" class="msg">LIBRARY_RESOLVE_LOAN</text>
  <line x1="725" y1="585" x2="945" y2="585" class="call"/><text x="835" y="576" class="msg">executeOnce(requestId, action)</text>
  <line x1="945" y1="625" x2="1165" y2="625" class="call"/><text x="1055" y="616" class="msg">resolveLoan(command)</text>
  <rect x="1157" y="625" width="16" height="305" class="activation"/>
  <line x1="1165" y1="670" x2="1370" y2="670" class="call"/><text x="1267" y="661" class="msg">读取快照并锁定 LOAN + COPY</text>
  <line x1="1370" y1="710" x2="1530" y2="710" class="call"/><text x="1450" y="701" class="msg">重读并检查 rowVersion</text>

  <rect x="1105" y="735" width="445" height="155" class="frame"/>
  <path d="M1105 735 H1225 L1245 756 H1105 z" class="frame-title"/>
  <text x="1120" y="751" class="frame-label">alt</text>
  <text x="1260" y="753" class="frame-label">resolution = RETURNED</text>
  <text x="1125" y="785" class="note-text">Loan → RETURNED；BookCopy → AVAILABLE</text>
  <line x1="1105" y1="810" x2="1550" y2="810" class="divider"/>
  <text x="1125" y="833" class="frame-label">else resolution = LOST</text>
  <text x="1125" y="863" class="note-text">Loan → LOST；BookCopy → LOST</text>

  <line x1="1370" y1="920" x2="1165" y2="920" class="return"/><text x="1267" y="911" class="msg">同一事务提交 Loan 与 BookCopy</text>
  <line x1="1165" y1="955" x2="945" y2="955" class="return"/><text x="1055" y="946" class="msg">LoanView</text>
  <line x1="945" y1="990" x2="1370" y2="990" class="call"/><text x="1157" y="981" class="msg">保存最终响应</text>
  <line x1="945" y1="1025" x2="725" y2="1025" class="return"/><text x="835" y="1016" class="msg">ResponseBody</text>
  <line x1="725" y1="1060" x2="290" y2="1060" class="return"/><text x="507" y="1051" class="msg">成功后自动重新查询该账号</text>
  <rect x="165" y="1075" width="530" height="28" class="note"/>
  <text x="430" y="1094" class="note-text" text-anchor="middle">用户当前借阅、借阅历史和副本状态共享同一份服务端事实</text>
</svg>
