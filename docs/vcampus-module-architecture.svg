<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1540" viewBox="0 0 1800 1540" role="img" aria-labelledby="title desc">
  <title id="title">vCampus 模块功能关系架构图</title>
  <desc id="desc">展示客户端、共享协议、服务端业务模块、公共基础设施和 Access 数据库之间的关系，并区分当前已实现基础框架与待实现业务模块。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#3568a8"/>
    </marker>
    <marker id="arrow-plan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#b46a1f"/>
    </marker>
    <style>
      .bg { fill: #f7f9fc; }
      .group { fill: #ffffff; stroke: #9aa9bb; stroke-width: 2; }
      .group-title { fill: #203247; font: 600 24px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .title { fill: #17283d; font: 700 38px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .subtitle { fill: #607086; font: 400 18px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .node { fill: #eef5ff; stroke: #5d83b6; stroke-width: 2; }
      .node-plan { fill: #fff4e7; stroke: #cc8a42; stroke-width: 2; }
      .node-data { fill: #eef8f1; stroke: #5b936a; stroke-width: 2; }
      .node-missing { fill: #fff0f0; stroke: #bd5f5f; stroke-width: 2.5; }
      .node-title { fill: #1e3047; font: 600 19px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; text-anchor: middle; }
      .node-text { fill: #4f6074; font: 400 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; text-anchor: middle; }
      .small { fill: #65758a; font: 400 14px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .edge { fill: none; stroke: #3568a8; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-plan { fill: none; stroke: #b46a1f; stroke-width: 2.5; stroke-dasharray: 9 7; marker-end: url(#arrow-plan); }
      .bus { fill: none; stroke: #7a8b9f; stroke-width: 2; }
      .edge-label { fill: #80501e; font: 500 14px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; text-anchor: middle; }
      .legend { fill: #42546a; font: 400 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1540"/>
  <text class="title" x="900" y="48" text-anchor="middle">vCampus 模块功能关系架构图</text>
  <text class="subtitle" x="900" y="78" text-anchor="middle">当前分支 as811 · 基础框架已实现，五个业务模块按设计文档待落地</text>

